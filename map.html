
<!DOCTYPE html>
<html>
  <head>
    <title>Mapa de tráfico vehicular</title>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBGmInnA0XmKh8AoW8SjlCVDEQzAhGyQto"></script>
    <script>
      function initMap() {
        const rectangulo = new google.maps.LatLngBounds(
            new google.maps.LatLng(-53.182604877545785, -70.95911023010035),
            new google.maps.LatLng(-53.17809805517051, -70.88282359600151)
        );
        const map = new google.maps.Map(document.getElementById("map"), {
          center: rectangulo.getCenter(),
          zoom: 15,
          mapTypeId: "roadmap",
          styles: [
            {
              featureType: "poi",
              stylers: [{ visibility: "off" }],
            },
            {
              featureType: "transit",
              stylers: [{ visibility: "off" }],
            },
            {
              featureType: "road",
              elementType: "labels.icon",
              stylers: [{ visibility: "off" }],
            },
            {
              featureType: "road.arterial",
              elementType: "labels.icon",
              stylers: [{ visibility: "off" }],
            },
            {
              featureType: "road",
              elementType: "labels.text.fill",
              stylers: [{ visibility: "off" }],
            },
            {
              featureType: "road",
              elementType: "labels.text.stroke",
              stylers: [{ visibility: "off" }],
            },
            {
              featureType: "road",
              elementType: "geometry.stroke",
              stylers: [{ visibility: "off" }],
            },
            {
              featureType: "administrative",
              elementType: "labels",
              stylers: [{ visibility: "off" }],
            },
            {
              featureType: "water",
              stylers: [{ visibility: "on" }],
            },
          ],
        });
        const trafficLayer = new google.maps.TrafficLayer();
        trafficLayer.setMap(map);
        map.fitBounds(rectangulo);
      }
    </script>
    <style>
      #map {
        height: 100%;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <script>
      initMap();
    </script>
  </body>
</html>
