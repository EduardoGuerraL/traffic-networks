<!DOCTYPE html>
<html>
  <head>
    <title>Mapa de tráfico vehicular</title>
    <script src="https://maps.googleapis.com/maps/api/js?key=CLAVE GOOGLE PLATFORM"></script>
    <script>
      function initMap() {
        const rectangulo = new google.maps.LatLngBounds(
            new google.maps.LatLng(-53.11559539618338, -70.95755666548068),
            new google.maps.LatLng(-53.18199942538556, -70.86365789332702)
        );
        // crear una instancia de TrafficModel para simular tráfico típico a una hora específica
        const trafficModel = new google.maps.TrafficModel();
        trafficModel.setValues({ time: new Date('2023-01-15T08:00:00') });
        const map = new google.maps.Map(document.getElementById("map"), {
          center: rectangulo.getCenter(),
          zoom: 11,
          mapTypeId: "roadmap",
          styles: [
            {
              featureType: "poi",
              stylers: [{ visibility: "off" }],
            },
            {
              featureType: "transit",
              stylers: [{ visibility: "off" }],
            },
            {
              featureType: "road",
              elementType: "labels.icon",
              stylers: [{ visibility: "off" }],
            },
            {
              featureType: "road.arterial",
              elementType: "labels.icon",
              stylers: [{ visibility: "off" }],
            },
            {
              featureType: "road",
              elementType: "labels.text.fill",
              stylers: [{ visibility: "off" }],
            },
            {
              featureType: "road",
              elementType: "labels.text.stroke",
              stylers: [{ visibility: "off" }],
            },
            {
              featureType: "road",
              elementType: "geometry.stroke",
              stylers: [{ visibility: "off" }],
            },
            {
              featureType: "administrative",
              elementType: "labels",
              stylers: [{ visibility: "off" }],
            },
            {
              featureType: "water",
              stylers: [{ visibility: "on" }],
            },
          ],
        });
        // crear una instancia de TrafficLayer y establecer el modelo de tráfico en la capa
        const trafficLayer = new google.maps.TrafficLayer();
        trafficLayer.setOptions({ trafficModel: trafficModel });

        // establecer la capa de tráfico en el mapa
        trafficLayer.setMap(map);
        map.fitBounds(rectangulo);
      }
    </script>
    <style>
      #map {
        height: 100%;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <script>
      initMap();
    </script>
  </body>
</html>
